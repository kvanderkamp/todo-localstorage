<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>To-Do List</h1>
        </header>
        
        <div class="input-section">
            <label for="new-task-input" class="visually-hidden">New task</label>
            <input 
                type="text" 
                id="new-task-input" 
                placeholder="What needs to be done?" 
                aria-label="New task input"
            >
            <button id="add-task-btn" aria-label="Add task">Add</button>
        </div>

        <div class="controls">
            <div class="filters">
                <button class="filter-btn active" data-filter="all" aria-label="Show all tasks">All</button>
                <button class="filter-btn" data-filter="active" aria-label="Show active tasks">Active</button>
                <button class="filter-btn" data-filter="completed" aria-label="Show completed tasks">Completed</button>
            </div>
            <div class="actions">
                <button id="clear-completed-btn" aria-label="Clear completed tasks">Clear Completed</button>
                <button id="reset-btn" aria-label="Reset application">Reset</button>
            </div>
        </div>

        <ul id="task-list" aria-label="Task list"></ul>

        <div class="task-count">
            <span id="task-counter">0 tasks</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
